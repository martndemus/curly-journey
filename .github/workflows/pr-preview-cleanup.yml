name: PR preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Find latest Pages artifact
        id: find-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last')
          if [ -n "$artifact" ] && [ "$artifact" != "null" ]; then
            echo "artifact_id=$(jq -r '.id' <<<"$artifact")" >>"$GITHUB_OUTPUT"
            echo "run_id=$(jq -r '.workflow_run.id' <<<"$artifact")" >>"$GITHUB_OUTPUT"
          fi

      - name: Download current Pages artifact
        if: steps.find-artifact.outputs.artifact_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: github-pages
          path: pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.find-artifact.outputs.run_id }}

      - name: Remove preview from site
        id: remove
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -rf site
          mkdir -p site
          if [ -f pages-artifact/artifact.tar ]; then
            tar -xf pages-artifact/artifact.tar -C site
          fi
          if [ -d "site/preview/$PR_NUMBER" ]; then
            rm -rf "site/preview/$PR_NUMBER"
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        if: steps.remove.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: steps.remove.outputs.changed == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
