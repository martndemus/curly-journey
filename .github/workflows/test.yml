name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Report test results
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: ${{ github.job }}
        run: |
          set -euo pipefail

          tests=$(grep -oP '(?<=<!-- tests )\d+' test-results.xml)
          pass=$(grep -oP '(?<=<!-- pass )\d+' test-results.xml)
          fail=$(grep -oP '(?<=<!-- fail )\d+' test-results.xml)
          skipped=$(grep -oP '(?<=<!-- skipped )\d+' test-results.xml)

          # The job's own check run shares its ID with the job itself, so
          # patching it (rather than creating a new check run) keeps the
          # counts grouped under this workflow instead of an unrelated one.
          check_run_id=$(curl -sS --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            | jq -r --arg name "$JOB_NAME" '.jobs[] | select(.name == $name) | .id')

          payload=$(jq -n \
            --arg title "$pass passed, $fail failed, $skipped skipped" \
            --arg summary "**$tests tests** — $pass passed, $fail failed, $skipped skipped." \
            '{ output: { title: $title, summary: $summary } }')

          curl -sS --fail-with-body -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/$check_run_id" \
            -d "$payload"
