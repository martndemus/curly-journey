name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build site
        run: ./scripts/build-site.sh

      - name: Find latest Pages artifact
        id: find-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last')
          if [ -n "$artifact" ] && [ "$artifact" != "null" ]; then
            echo "artifact_id=$(jq -r '.id' <<<"$artifact")" >>"$GITHUB_OUTPUT"
            echo "run_id=$(jq -r '.workflow_run.id' <<<"$artifact")" >>"$GITHUB_OUTPUT"
          fi

      - name: Download current Pages artifact
        if: steps.find-artifact.outputs.artifact_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: github-pages
          path: pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.find-artifact.outputs.run_id }}

      - name: Assemble site with existing previews
        run: |
          previews=""
          if [ -f pages-artifact/artifact.tar ]; then
            mkdir -p pages-artifact-extracted
            tar -xf pages-artifact/artifact.tar -C pages-artifact-extracted
            if [ -d pages-artifact-extracted/preview ]; then
              previews=pages-artifact-extracted/preview
            fi
          fi
          if [ -n "$previews" ]; then
            mkdir -p _site/preview
            cp -r "$previews/." _site/preview/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 7
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
